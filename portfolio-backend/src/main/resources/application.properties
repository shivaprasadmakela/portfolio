spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
spring.application.name=portfolio-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio
spring.datasource.username=postgres
spring.datasource.password=Shiva@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false

# AI Client Configuration
ai.provider=${AI_PROVIDER:fallback}
ai.fallback.cooldown-ms=${AI_COOLDOWN_MS:3600000}

# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:PLACEHOLDER}
gemini.api.keys=${GEMINI_API_KEYS:PLACEHOLDER}
gemini.url.template=${GEMINI_URL_TEMPLATE:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=%s}

# OpenRouter Configuration
openrouter.api.key=${OPENROUTER_API_KEY:PLACEHOLDER}
openrouter.api.keys=${OPENROUTER_API_KEYS:PLACEHOLDER}
openrouter.url=${OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.model=${OPENROUTER_MODEL:google/gemma-4-31b-it:free}