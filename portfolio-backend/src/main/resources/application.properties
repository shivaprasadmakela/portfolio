spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
spring.application.name=portfolio-backend

# Local development defaults. Credentials come from the environment (or .env,
# which is gitignored) — never hardcode them here; this file is committed.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway owns the schema in every environment. V1 is idempotent
# (CREATE TABLE IF NOT EXISTS) and V2 only seeds an empty table, so adopting a
# database that already has both is safe. baseline-version=2 means an existing
# database is recorded as already at V2 and neither migration re-runs on it;
# a fresh database has an empty schema, so both run normally.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://www.shivaprasadm.in,https://shivaprasadm.in,http://localhost:5173}

# AI Client Configuration
ai.provider=${AI_PROVIDER:fallback}
ai.fallback.cooldown-ms=${AI_COOLDOWN_MS:3600000}

# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:PLACEHOLDER}
gemini.api.keys=${GEMINI_API_KEYS:PLACEHOLDER}
gemini.url.template=${GEMINI_URL_TEMPLATE:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=%s}

# OpenRouter Configuration
openrouter.api.key=${OPENROUTER_API_KEY:PLACEHOLDER}
openrouter.api.keys=${OPENROUTER_API_KEYS:PLACEHOLDER}
openrouter.url=${OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.model=${OPENROUTER_MODEL:google/gemma-4-31b-it:free}
