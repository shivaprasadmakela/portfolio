spring:
  datasource:
    # Credentials travel inside DATABASE_URL (as the current Cloud Run deployment
    # supplies them), so username/password are intentionally not set here.
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway owns the schema. 'none' keeps a schema drift from blocking a deploy;
      # dev uses 'validate' so drift surfaces there instead.
      ddl-auto: none
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2

server:
  port: ${PORT:8080}
